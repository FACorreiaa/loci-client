name: Deploy to Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      deploy_reason:
        description: "Reason for deployment"
        required: false
        default: "Manual deployment"

env:
  NODE_VERSION: "24"

jobs:
  deploy-staging:
    name: Deploy to Staging (Beta)
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.loci.dev # Update with actual staging URL

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Build for staging
        run: pnpm run build
        env:
          VITE_CONNECT_BASE_URL: ${{ secrets.STAGING_API_URL }}
          VITE_MAPBOX_API_KEY: ${{ secrets.VITE_MAPBOX_API_KEY }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          VITE_STRIPE_PRICE_ID_MONTHLY: ${{ vars.VITE_STRIPE_PRICE_ID_MONTHLY }}
          VITE_STRIPE_PRICE_ID_ANNUAL: ${{ vars.VITE_STRIPE_PRICE_ID_ANNUAL }}
          # vinxi build forces NODE_ENV=production regardless; keep it explicit and consistent.
          NODE_ENV: production

      - name: Deploy to Cloudflare (Staging)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Post deployment notification
        if: success()
        run: |
          echo "✅ Staging deployment successful!"
          echo "Deployed commit: ${{ github.sha }}"
          echo "Trigger: ${{ github.event_name }}"
