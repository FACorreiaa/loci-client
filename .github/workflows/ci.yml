name: CI

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging]

# A newer push to the same pull request supersedes the run in flight. Pushes
# to a branch are never cancelled: each commit on main keeps its own result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"

# Four independent jobs, no `needs:` between them: the wall time is the
# slowest job, not the sum.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Errors fail the job. Warnings are the BACKLOG block in .oxlintrc.json
      # and do not, so there is no --deny-warnings here. --quiet keeps the
      # backlog out of the log so an error is not buried; `pnpm run lint`
      # locally prints it in full.
      - name: Run Oxlint
        run: pnpm run lint --quiet

      # oxlint has no Solid plugin: solid/reactivity and friends run in ESLint.
      - name: Run ESLint (Solid rules)
        run: pnpm run lint:solid

      # Required check, no path filter: motion JSON drift, the single three
      # importer, and colour literals in the 3D mascot (BRD-001).
      - name: Brand guard
        run: pnpm run brand:guard

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript check
        run: pnpm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          VITE_CONNECT_BASE_URL: ${{ secrets.VITE_API_URL }}
          VITE_MAPBOX_API_KEY: ${{ secrets.VITE_MAPBOX_API_KEY }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST || secrets.VITE_POSTHOG_HOST }}
          VITE_STRIPE_PRICE_ID_MONTHLY: ${{ vars.VITE_STRIPE_PRICE_ID_MONTHLY }}
          VITE_STRIPE_PRICE_ID_ANNUAL: ${{ vars.VITE_STRIPE_PRICE_ID_ANNUAL }}

      # Every route's own JS and the lazy total, against size-budget.json.
      # Production shape: .env.production sets VITE_MASCOT_3D_URL.
      - name: Size budget
        run: pnpm run size

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .output/
          retention-days: 1

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      # Full history: `vitest --changed` diffs against the base branch.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pull requests run only the tests whose import graph the change touches
      # (the whole suite when a forceRerunTriggers file changes, see
      # vitest.config.ts). The push that lands on the branch runs everything.
      - name: Run affected unit tests
        if: github.event_name == 'pull_request'
        run: pnpm exec vitest run --changed origin/${{ github.base_ref }} --passWithNoTests

      - name: Run unit tests
        if: github.event_name != 'pull_request'
        run: pnpm test
